name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        with:
          path: . # The root location of your Astro project inside the repository. (optional)
          node-version: 22
          # 钉死版本，别再用 latest——浮动的包管理器会在无人改动仓库的情况下把部署搞挂：
          # pnpm 先是漂到 11.x（用 node:sqlite，要 Node >= 22.13，撞死在 Node 20 上），
          # 抬了 Node 之后又撞上 pnpm 10+ 的 ERR_PNPM_IGNORED_BUILDS（默认拒跑 sharp/esbuild
          # 的构建脚本并退出 1）。9.x 与本仓库的 lockfileVersion 9.0 同代，两个坑都没有。
          package-manager: pnpm@9.15.9

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4