name: Hear CI infrastructure
on:
  pull_request:
    paths: ['ci/**', '.github/workflows/*.yml']
  push:
    branches: [main]
    paths: ['ci/**', '.github/workflows/*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - run: node --test ci/*.test.mjs
